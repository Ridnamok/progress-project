<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Progress.css" />
    <link rel="stylesheet" href="Progress.js" defer/>
</head>

<body>
    <ul style="list-style-type: none">
        <div>Progress</div>
        <li>
            <div class="footer">
                <div class="progress-container">
                    <svg class="progress-circle" viewBox="0 0   100   100">
                        <circle class="progress-track" cx="50" cy="50" r="42"/>
                        <circle class="progress-value" cx="50" cy="50" r="42" transform="rotate(-90   50 50) "/>
                    </svg>
                </div>

            </div>
        </li>
        <li>
            <div class="bottom">
                <ul style="list-style-type: none" id="elem">
                    <li>
                        <div class="value">
                            <input type="text" value="100" />
                        </div>
                    </li>
                    <li>
                        <div class="switch">
                            <input type="checkbox">
                            <div class="round_button"></div> 
                        </div>
                    </li>
                    <li>
                        <div class="switch2">
                        <input type="checkbox">
                        <div class="round_button2"></div>
                </div>
                    </li>
                </ul>
                     
            </div>
            <ul id="desc" style="list-style-type: none">
                <li>Value</li>
                <li>Animate</li>
                <li>Hide</li>
            </ul>
        </li>
    </ul>
</body>
</html>
